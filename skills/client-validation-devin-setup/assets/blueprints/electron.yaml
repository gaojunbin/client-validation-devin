---
runs-on: windows
initialize:
  - name: Install Node.js
    uses: github.com/actions/setup-node@v4
    with:
      node-version: "22"
  - name: Native module toolchain
    run: |
      git config --global core.longpaths true
      choco install -y visualstudio2022buildtools visualstudio2022-workload-vctools python3
maintenance:
  - name: Install dependencies and warm the build
    run: |
      if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install
      elif [ -f yarn.lock ]; then corepack enable && yarn install
      else npm install; fi
      npm run build --if-present || echo "WARN: renderer build failed"
knowledge:
  - name: build
    contents: |
      npm run build --if-present && npx electron-builder --win dir -> dist/win-unpacked/<App>.exe
      Electron Forge: npm run package -> out/<App>-win32-x64/<App>.exe
  - name: test
    contents: npm test
  - name: lint
    contents: npm run lint
  - name: run
    contents: npm start

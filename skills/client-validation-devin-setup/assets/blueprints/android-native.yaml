# Devin blueprint template: native Android app (Kotlin/Java, Jetpack Compose or Views, Gradle).
# Copy to .devin/blueprint.yaml and adjust: JDK version, compileSdk / build-tools to match
# app/build.gradle(.kts), the app module name (app), and the launcher activity in knowledge.
# Validation commands, devices and scenarios belong in .devin/qa.toml.
runs-on: default
initialize:
  - name: Install JDK 17
    uses: github.com/actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"
  - name: Install Android SDK, emulator and AVDs
    run: |
      export ANDROID_HOME="$HOME/android-sdk"
      mkdir -p "$ANDROID_HOME/cmdline-tools" && cd "$ANDROID_HOME/cmdline-tools"
      curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o tools.zip
      unzip -q tools.zip -d tmp && mv tmp/cmdline-tools latest && rm -rf tools.zip tmp
      export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
      yes | sdkmanager --licenses > /dev/null
      sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "emulator" "system-images;android-34;google_apis;x86_64"
      echo no | avdmanager create avd -n devin -k "system-images;android-34;google_apis;x86_64" --device pixel_6
      echo no | avdmanager create avd -n devin-tablet -k "system-images;android-34;google_apis;x86_64" --device pixel_tablet \
        || echo "pixel_tablet profile unavailable; tablet AVD skipped"
      { echo "export ANDROID_HOME=$ANDROID_HOME"
        echo 'export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"'
      } | tee -a "$ENVRC" >> ~/.bashrc
maintenance:
  - name: Download dependencies and warm the build
    run: |
      export ANDROID_HOME="$HOME/android-sdk"
      ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest || echo "WARN: warm build failed"
knowledge:
  - name: build
    contents: ./gradlew assembleDebug -> app/build/outputs/apk/debug/app-debug.apk
  - name: test
    contents: |
      Unit: ./gradlew testDebugUnitTest
      Instrumented (emulator running): ./gradlew connectedDebugAndroidTest -> app/build/reports/androidTests/connected/
  - name: lint
    contents: ./gradlew lintDebug
  - name: run
    contents: |
      emulator -avd devin -no-audio -gpu swiftshader_indirect &
      adb wait-for-device; until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; do sleep 2; done
      adb install -r app/build/outputs/apk/debug/app-debug.apk
      adb shell monkey -p <application-id> -c android.intent.category.LAUNCHER 1

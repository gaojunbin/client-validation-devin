# Devin blueprint template: Flutter app for Android, Linux, iOS, macOS and Windows.
# Copy to .devin/blueprint.yaml and adjust: Flutter channel/version (pin a tag with -b <version> to match
# pubspec.yaml), Android API level and build-tools, the simulator name, and the bundle paths in knowledge.
# Delete the documents (or build lines) for platforms the product does not ship.
# Validation commands, devices and scenarios belong in .devin/qa.toml; knowledge here only tells
# Devin how to build and run the app.
runs-on: default
initialize:
  - name: Install JDK 17
    uses: github.com/actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"
  - name: Install Linux desktop build and QA tools
    run: |
      SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO=sudo
      $SUDO apt-get update
      $SUDO apt-get install -y curl git unzip xz-utils zip libglu1-mesa clang cmake ninja-build pkg-config \
        libgtk-3-dev liblzma-dev libstdc++-12-dev xdotool wmctrl imagemagick fonts-noto-cjk
  - name: Install Flutter
    run: |
      git clone https://github.com/flutter/flutter.git -b stable --depth 1 "$HOME/flutter"
      echo 'export PATH="$HOME/flutter/bin:$PATH"' | tee -a "$ENVRC" >> ~/.bashrc
  - name: Install Android SDK, emulator and AVDs
    run: |
      export ANDROID_HOME="$HOME/android-sdk"
      mkdir -p "$ANDROID_HOME/cmdline-tools" && cd "$ANDROID_HOME/cmdline-tools"
      curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o tools.zip
      unzip -q tools.zip -d tmp && mv tmp/cmdline-tools latest && rm -rf tools.zip tmp
      export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
      yes | sdkmanager --licenses > /dev/null
      sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "emulator" "system-images;android-34;google_apis;x86_64"
      echo no | avdmanager create avd -n devin -k "system-images;android-34;google_apis;x86_64" --device pixel_6
      echo no | avdmanager create avd -n devin-tablet -k "system-images;android-34;google_apis;x86_64" --device pixel_tablet \
        || echo "pixel_tablet profile unavailable; tablet AVD skipped"
      { echo "export ANDROID_HOME=$ANDROID_HOME"
        echo 'export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"'
      } | tee -a "$ENVRC" >> ~/.bashrc
  - name: Precache Flutter artifacts
    run: |
      export PATH="$HOME/flutter/bin:$PATH" ANDROID_HOME="$HOME/android-sdk"
      flutter config --no-analytics --android-sdk "$ANDROID_HOME"
      flutter precache --android --linux
      yes | flutter doctor --android-licenses > /dev/null || true
maintenance:
  - name: Resolve packages and warm builds
    run: |
      export PATH="$HOME/flutter/bin:$HOME/android-sdk/platform-tools:$PATH" ANDROID_HOME="$HOME/android-sdk"
      flutter pub get
      flutter build apk --debug || echo "WARN: Android warm build failed"
      flutter build linux --debug || echo "WARN: Linux warm build failed"
knowledge:
  - name: build
    contents: |
      Android: flutter build apk --debug   -> build/app/outputs/flutter-apk/app-debug.apk
      Linux:   flutter build linux --debug -> build/linux/x64/debug/bundle/
  - name: test
    contents: flutter test
  - name: lint
    contents: flutter analyze
  - name: run
    contents: |
      Android: emulator -avd devin -no-audio -gpu swiftshader_indirect &  then  adb wait-for-device; flutter run -d emulator-5554
      Linux desktop: flutter run -d linux
---
runs-on: macos
initialize:
  - name: Install Flutter and CocoaPods
    run: |
      brew install cocoapods
      git clone https://github.com/flutter/flutter.git -b stable --depth 1 "$HOME/flutter"
      echo 'export PATH="$HOME/flutter/bin:$PATH"' | tee -a "$ENVRC" >> ~/.zshrc
      export PATH="$HOME/flutter/bin:$PATH"
      flutter config --no-analytics
      flutter precache --ios --macos
maintenance:
  - name: Resolve packages, warm builds, pre-boot the simulator
    run: |
      export PATH="$HOME/flutter/bin:$PATH"
      flutter pub get
      flutter build ios --simulator --debug || echo "WARN: iOS warm build failed"
      flutter build macos --debug || echo "WARN: macOS warm build failed"
      xcrun simctl boot "iPhone 17" || true
knowledge:
  - name: build
    contents: |
      iOS:   flutter build ios --simulator --debug -> build/ios/iphonesimulator/Runner.app
      macOS: flutter build macos --debug           -> build/macos/Build/Products/Debug/<App>.app
  - name: test
    contents: flutter test
  - name: lint
    contents: flutter analyze
  - name: run
    contents: |
      iOS: open -a Simulator; flutter run -d "iPhone 17"
      macOS: flutter run -d macos
---
runs-on: windows
initialize:
  - name: Install Visual Studio C++ build tools
    run: choco install -y visualstudio2022buildtools visualstudio2022-workload-vctools
  - name: Install Flutter and enable Developer Mode for plugin symlinks
    run: |
      git config --global core.longpaths true
      git clone https://github.com/flutter/flutter.git -b stable --depth 1 /c/flutter
      echo 'export PATH="/c/flutter/bin:$PATH"' | tee -a "$ENVRC" >> ~/.bashrc
      MSYS_NO_PATHCONV=1 reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1
      /c/flutter/bin/flutter config --no-analytics
      /c/flutter/bin/flutter precache --windows
maintenance:
  - name: Resolve packages and warm the build
    run: |
      export PATH="/c/flutter/bin:$PATH"
      flutter pub get
      flutter build windows --debug || echo "WARN: Windows warm build failed"
knowledge:
  - name: build
    contents: flutter build windows --debug -> build/windows/x64/runner/Debug/<app>.exe
  - name: test
    contents: flutter test
  - name: lint
    contents: flutter analyze
  - name: run
    contents: flutter run -d windows
